app:
    name: mariadb Slave
    code: mariadbslave
    notify: rniranjan@cloudbourne.co

build:
    version: 11.4
    env: DEV
    build_file: none
    output_files: output/*.zip
    image_template: mariadb_slave-11.4

deploy:
    context: plantmaster/DEV
    type: statefulset
    replicas: 1
    port:
    - 3306

volumes:
  - claim: mariadb-slave-data
    class: "linode-block-storage"
    mount: /appz/data/mysql
    name: data
    size: 5Gi
    matchLabels: false
  - claim: mariadb-slave-backup
    class: "linode-block-storage"
    mount: /appz/backup
    name: backup
    size: 5Gi
    matchLabels: false

properties:
    MYSQL_REPLICATION_USER: replication
    MYSQL_REPLICATION_PASSWORD:
      vault: MYSQL_REPLICATION_PASSWORD
    MYSQL_ROOT_PASSWORD:
      vault: MYSQL_ROOT_PASSWORD_KEY
    DB_MASTER: mariadb-master-11-4
    MYSQL_USER: wordpress
    MYSQL_PASSWORD:
      vault: MYSQL_PASSWORD_KEY
    BACKUP_RETENTION: 1
    BINLOG_EXPIRE_LOGS_SECONDS: 259200
    revision : 3
